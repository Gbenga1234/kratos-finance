[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kratos-finance"
version = "0.1.0"
description = "A containerized fintech transfer API starter"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "redis>=5.2,<7",
]

[project.optional-dependencies]
api = [
    "gunicorn>=23,<24",
    "uvicorn[standard]>=0.32,<1",
    "uvicorn-worker>=0.3,<1",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
